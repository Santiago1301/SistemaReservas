server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad: el navegador solo carga recursos propios y solo
    # puede conectarse al gateway; la página no puede incrustarse en otro sitio.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:4000; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri /index.html;
    }
}
